<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blooming Lilies</title>
<style>
  :root{
    color-scheme: dark;
    --sky-top:#0a0818;
    --sky-mid:#1c1436;
    --sky-low:#2c1b3f;
    --glow:#ffcf8a;
    --ink:#fbeedd;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --sky-top:#0a0818; --sky-mid:#1c1436; --sky-low:#2c1b3f; --glow:#ffcf8a; --ink:#fbeedd; }
  }
  :root[data-theme="dark"]{ --sky-top:#0a0818; --sky-mid:#1c1436; --sky-low:#2c1b3f; --glow:#ffcf8a; --ink:#fbeedd; }
  *{ box-sizing:inherit; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(90% 55% at 50% 78%, rgba(255,207,138,.16) 0%, rgba(255,207,138,0) 65%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 16px calc(20px + env(safe-area-inset-bottom,0px));
    font-family:Georgia, 'Times New Roman', serif;
    color:var(--ink);
    overflow:hidden;
    position:relative;
  }

  .scene{ position:relative; width:320px; max-width:88vw; height:400px; }

  .star{ position:absolute; border-radius:50%; background:#fff2d9; animation:twinkle ease-in-out infinite; }

  .ground-glow{
    position:absolute; left:50%; bottom:18px; width:220px; height:90px;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,207,138,.5), rgba(255,207,138,0) 70%);
    filter:blur(4px);
    animation:fadein 1.2s ease-out .3s both;
  }

  .blade{
    position:absolute; bottom:22px; width:6px; background:linear-gradient(180deg,#2f5c34,#4a8b4f);
    border-radius:6px 6px 0 0; transform-origin:bottom center;
    animation:fadein .6s ease-out both;
  }

  .stem{ position:absolute; width:4px; background:linear-gradient(180deg,#3f6b45,#5f9a58);
    border-radius:3px; transform-origin:bottom center;
    animation-name:stem-grow; animation-timing-function:cubic-bezier(.22,1,.36,1); animation-fill-mode:both; }

  .leaf{
    position:absolute; width:26px; height:14px; background:#4f8a52; border-radius:0 100% 0 100%;
    transform-origin:0 50%; animation:fadein .6s ease-out both;
  }

  .flower{ position:absolute; }
  .flower svg{ position:absolute; overflow:visible; }

  .petal{ transform-box:fill-box; transform-origin:50% 100%; animation-name:petalbloom; animation-timing-function:cubic-bezier(.3,1.4,.4,1); animation-fill-mode:both; }
  .stamen{ transform-box:fill-box; transform-origin:50% 100%; animation-name:fadein2; animation-duration:.5s; animation-timing-function:ease-out; animation-fill-mode:both; }
  .pistil{ transform-box:fill-box; transform-origin:50% 50%; animation-name:fadein2; animation-duration:.5s; animation-timing-function:ease-out; animation-fill-mode:both; }
  .glow-blob{ animation-name:fadein2; animation-duration:.8s; animation-timing-function:ease-out; animation-fill-mode:both; }

  .heart{ position:absolute; animation-name:heart-float; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }

  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes fadein2{ from{ opacity:0; transform:scale(.5); } to{ opacity:1; transform:scale(1); } }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.75; } }
  @keyframes stem-grow{
    from{ transform:rotate(var(--rot)) scaleY(0); opacity:0; }
    to{ transform:rotate(var(--rot)) scaleY(1); opacity:1; }
  }
  @keyframes petalbloom{
    0%{ transform:scale(.15) rotate(-26deg); opacity:0; }
    50%{ opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes heart-float{
    0%{ transform:translateY(0) scale(.75); opacity:0; }
    15%{ opacity:1; }
    82%{ opacity:.85; }
    100%{ transform:translateY(-110px) scale(1.05); opacity:0; }
  }

  .caption-row{ margin-top:10px; text-align:center; }
  #replay-btn{
    background:none; border:none; font-family:Georgia, serif; font-style:italic;
    font-size:16px; color:#e7d8c4; letter-spacing:.02em; padding:10px 14px; cursor:pointer;
    border-bottom:1px solid rgba(251,238,221,.3);
  }
  #replay-btn:hover, #replay-btn:focus-visible{ color:#fff; border-color:rgba(251,238,221,.7); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
